name: tibber
version: 1.0.3
description: Tibber MCP integration with required credential setup and electricity summaries.
author: Mehdi Shahdoost
homepage: https://github.com/mehdishahdoost/tibber-plugin
requires_hermes: ">=0.21.6"
requires_env:
